<div id="visitPopup"
    class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">

    <div class="bg-white p-8 rounded-xl w-full max-w-md relative">

        <button onclick="closeVisitPopup()"
            class="absolute top-3 right-4 text-2xl">
            &times;
        </button>

        <h3 class="text-2xl font-bold mb-4">
            Schedule Site Visit
        </h3>

        <input type="text" placeholder="Your Name"
            class="w-full border p-3 rounded mb-3">

        <input type="tel" placeholder="Phone Number"
            class="w-full border p-3 rounded mb-3">

        <button
            class="w-full bg-[#d9a441] text-white py-3 rounded-lg font-semibold">
            Submit
        </button>

    </div>

</div>
