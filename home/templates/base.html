<style>
  ::-webkit-scrollbar {
      width: 8px;
  }

  ::-webkit-scrollbar-track {
      background: #F3F1EE;
  }

  ::-webkit-scrollbar-thumb {
      background: #E4C58D;
      border-radius: 10px;
  }

  ::-webkit-scrollbar-thumb:hover {
      background: #D2962D;
  }
  body{
  background:#f5f5f5;
  }

  .popup-overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,.75);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:99999;
  padding:20px;
  animation:fade .3s ease;
  }

  @keyframes fade{
  from{opacity:0;}
  to{opacity:1;}
  }

  .popup-box{
  width:100%;
  max-width:480px;
  background:#fff;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 25px 60px rgba(0,0,0,.35);
  animation:popup .4s ease;
  position:relative;
  }

  @keyframes popup{

  from{
  opacity:0;
  transform:translateY(30px) scale(.95);
  }

  to{
  opacity:1;
  transform:translateY(0) scale(1);
  }

  }

  /* Close */

  .close-popup{
  position:absolute;
  right:18px;
  top:15px;
  font-size:28px;
  cursor:pointer;
  color:#666;
  transition:.3s;
  }

  .close-popup:hover{
  color:#000;
  }

  /* Header */

  .popup-header{
  padding:35px 35px 20px;
  text-align:center;
  background:linear-gradient(135deg,#c79a3b,#f0cf7d);
  color:#fff;
  }

  .popup-header h2{
  font-size:28px;
  margin-bottom:10px;
  }

  .popup-header p{
  font-size:15px;
  line-height:1.6;
  opacity:.95;
  }

  /* Form */

  .popup-body{
  padding:30px;
  }

  .popup-body input{
  width:100%;
  height:52px;
  padding:0 18px;
  border:1px solid #ddd;
  border-radius:10px;
  margin-bottom:16px;
  font-size:15px;
  outline:none;
  transition:.3s;
  }

  .popup-body input:focus{
  border-color:#c79a3b;
  box-shadow:0 0 10px rgba(199,154,59,.25);
  }

  .popup-body button{
  width:100%;
  height:55px;
  border:none;
  background:#c79a3b;
  color:#fff;
  font-size:17px;
  font-weight:bold;
  border-radius:10px;
  cursor:pointer;
  transition:.3s;
  }

  .popup-body button:hover{
  background:#b68527;
  }

  @media(max-width:500px){

  .popup-header{
  padding:28px 22px 18px;
  }

  .popup-header h2{
  font-size:23px;
  }

  .popup-body{
  padding:22px;
  }

  }

</style>

</head>
<body>
