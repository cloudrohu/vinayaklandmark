{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{% block title %}{{ settings_obj.meta_title }}{% endblock %}</title>

<meta name="description" content="{{ settings_obj.site_name }}">

<meta name="keywords" content="">

  {% if settings_obj.favicon %}
    <link rel="icon" href="{{ settings_obj.favicon.url }}" type="image/png">
    <link rel="apple-touch-icon" href="{{ settings_obj.favicon.url }}">
  {% else %}
    <link rel="icon" href="{% static 'images/default-favicon.png' %}">
  {% endif %}

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/18.2.1/css/intlTelInput.css">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{% static '' %}assets/css/style.css">

<style>
::-webkit-scrollbar {
    width: 8px;
}

::-webkit-scrollbar-track {
    background: #F3F1EE;
}

::-webkit-scrollbar-thumb {
    background: #E4C58D;
    border-radius: 10px;
}

::-webkit-scrollbar-thumb:hover {
    background: #D2962D;
}
</style>

</head>
<body>



{% include 'includes/header.html' %}


{% block content %}{% endblock %}


{% include 'includes/popups.html' %}



<script>
    (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);})(window,document,'script','dataLayer','GTM-{{ settings_obj.googletagmanager }}');
</script>

<noscript>
  <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-{{ settings_obj.googletagmanager }}" height="0" width="0" style="display:none;visibility:hidden"></iframe>
</noscript>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static '' %}assets/js/main.js"></script>
</body>
</html>
